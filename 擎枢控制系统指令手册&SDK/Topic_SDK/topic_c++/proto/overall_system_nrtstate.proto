// 协议
syntax = "proto3";

// 包名
package overall_system_nrtstate;

// 定义通用的消息头
message Header {
    int64 timestamp = 1;      // 系统时间戳
    int64 frame_id = 2;       // 帧id
}


// 从站信息
message Slave {
  string slave_name = 1; 
  int32 phy_id = 2;         // 从站物理节点号
  int32 alias = 3;          // 从站别名
  int32 slave_state = 4;    // Init、PreOP、OP、SafeOP
  int32 is_online = 5;      // 是否在线
  bool is_virtual = 6;	    // 是否虚化
  bool is_error = 7;	      // 是否错误
}

// 控制器信息
message Controller {
  repeated Slave slave = 1;   		  // 从站信息
}



// 关节信息
message Joint {
  double max_position = 1;          // 最大角度,rad
  double min_position = 2;	        // 最小角度,rad
  double max_vel = 3;	              // 最大角速度,rad/s
  double min_vel = 4;	              // 最小角速度,rad/s
  double max_acc = 5;               // 最大角速度,rad/s/s
  double min_acc = 6;	              // 最大角速度,rad/s/s
  double max_collision_torque = 7;  // 最大关节碰撞力矩,Nm
}

// tool
message Tool {
	string tool_name = 1; 
	repeated double data= 2; 
}

// wobj
message Wobj {
	string wobj_name = 1; 
	repeated double data= 2; 
}

// load
message Load {
	string load_name = 1; 
	repeated double data= 2; 
}

// point
message Point {
	string point_name = 1; 
	Tool tool= 2; 
	Wobj wobj=3;
	repeated double robottarget=4;
	repeated double jointtarget=5;
}

// IO
message IOdata {
  string io_name = 1;
  double io_data = 2;
}

// MatrixVariable
message MatrixVariable {
  string matrixvar_name = 1;
  repeated double data = 2;
}

// 干涉区
message InfRng {
  // 基础和控制属性
  string  infrng_name = 1;
  string  infrng_action = 2;            // stop/ pause
  int32   infrng_isenable = 3;          // 0 / 1
  int32   infrng_priority = 4;
  string  infrng_zonetype = 5;          // interfere / safety
  string  infrng_diname = 6;
  string  infrng_doname = 7;

  // 几何属性
  string infrng_shape = 8;              // box / sphere / cylinder
  repeated double infrng_center = 9;    // {x,y,z}，单位m
  repeated double infrng_size = 10;     // box:{l,w,h} sphere:{r} cylinder:{r,h}
  repeated double infrng_euler = 11;    // {rx,ry,rz},单位 rad
  double infrng_margin = 12;            // 单位m
  bool infrng_is_twopoint = 13;

  // 仅 is_twopoint=true 时有值，否则为空数组
  repeated double infrng_point1 = 14;   // {x,y,z}
  repeated double infrng_point2 = 15;   // {x,y,z}
}

// 机器人模型信息
message Model {
	string model_name = 1;            // 模型名称
	string model_type = 2;            // 模型类型
	repeated Joint joint = 3;         // 机器人关节初始化信息
	repeated Tool tools = 4;          // 工具位姿集合
	repeated Wobj wobjs = 5;          // 工件位姿集合
	repeated Load loads = 6;          // 负载参数
	repeated Point teach_points = 7;  // 负载参数
	bool is_using_sp = 8;             // 是否使用了自动规避奇异点功能
	bool is_collision_detection = 9;  // 是否开启碰撞检测
  int32 take_photo = 10;            // 启动相机拍照
  repeated IOdata io = 11;          // IO
  repeated MatrixVariable matrix_variables = 12;  // 系统默认的变量集
  repeated double drag_in_cst_coef = 13;          // 电流环拖动的系数
  repeated InfRng inf_rngs = 14;                  // 安全区配置
}

// 子系统
message Subsystem {
  string subsystem_name = 1; 
  int32 id = 2;       // 节点
  int32 state = 3;    // 状态
  bytes data = 4;     // 上报的pb消息内容
}

// 接口
message Interface {
  string interface_name = 1;
  int32 id = 2;       //节点
  int32 state = 3;    //状态
}

// 统一系统状态消息
message SystemNrtState{

  Header head = 1;                    // 消息头
	
  bool system_running_state = 2;		  // 系统状态：

  repeated Model model = 3;   		    // 模型信息
	Controller controller = 4;   		    // 控制器信息 (EhterCAT, CANOPEN, ETHERNET, MODBUS, 其他私有协议)

	repeated Subsystem subsystem = 5;   // 子系统信息 (外部子系统，集成应用)
	
  repeated Interface interface = 6;   // 接口信息 (框架对外呈现的接口形式，如：串口、网络、CAN)
  
  bool system_is_init = 7;            // codeit系统是否已经完成了初始化
}
